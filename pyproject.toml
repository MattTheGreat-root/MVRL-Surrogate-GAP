[project]
name = "mvrl"
version = "0.1.0"
description = "Reference machinery for measuring the surrogate gap in reinforcement learning for asset allocation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mvrl"]
